<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Food Store</title>
  <link rel="stylesheet" href="../../login.css">
</head>
<body>
  <main class="auth-container">
    <h1>Food Store</h1>
    <h2>Crear Cuenta</h2>
    
    <form id="form-registro" class="auth-form">
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="tu@email.com" required>
      </div>
      
      <div class="form-group">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" required minlength="6">
      </div>
      
      <div class="form-group">
        <label for="confirm-password">Confirmar Contraseña:</label>
        <input type="password" id="confirm-password" name="confirm-password" placeholder="Repite tu contraseña" required minlength="6">
      </div>
      
      <div id="mensaje-error" class="mensaje error hidden"></div>
      <div id="mensaje-exito" class="mensaje success hidden"></div>
      
      <button type="submit" class="btn-primary">Registrarse</button>
    </form>
    
    <p class="auth-link">
      ¿Ya tienes cuenta? <a href="../login/index.html">Iniciar Sesión</a>
    </p>
  </main>
  
  <script type="module" src="../../../src/pages/auth/registro/registro.ts"></script>
</body>
</html>
