<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Food Store Admin</title>
  <style>
    :root {
      --primary: #ff4500;
      --primary-hover: #e03e00;
      --white: #ffffff;
      --text: #333333;
      --text-light: #666666;
      --bg: #f5f5f5;
      --border: #ddd;
      --sidebar-width: 220px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: var(--bg); min-height: 100vh; }

    .admin-header {
      background: var(--primary); color: var(--white); padding: 16px 24px;
      display: flex; justify-content: space-between; align-items: center;
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    }
    .admin-header h1 { font-size: 24px; }
    .admin-header nav { display: flex; align-items: center; gap: 16px; }
    .admin-header #user-info { font-size: 14px; }
    .btn-logout {
      padding: 6px 14px; background: var(--white); color: var(--primary);
      border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px;
    }

    .admin-layout {
      display: flex; padding-top: 60px; min-height: 100vh;
    }

    .admin-sidebar {
      width: var(--sidebar-width); background: #2d2d2d; color: #ccc;
      padding: 20px 0; position: fixed; top: 60px; bottom: 0; overflow-y: auto;
    }
    .admin-sidebar a {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 20px; color: #ccc; text-decoration: none;
      font-size: 14px; transition: all 0.15s;
    }
    .admin-sidebar span {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 20px; color: #888;
      font-size: 14px;
    }
    .admin-sidebar a:hover { background: #3d3d3d; color: var(--white); }
    .admin-sidebar a.active { background: var(--primary); color: var(--white); font-weight: bold; }

    .admin-content {
      margin-left: var(--sidebar-width); padding: 24px; flex: 1;
    }

    .admin-content h2 { margin-bottom: 24px; color: var(--text); }

    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px; margin-bottom: 32px;
    }
    .stat-card {
      background: var(--white); border-radius: 10px; padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: flex; flex-direction: column; gap: 8px;
    }
    .stat-card .stat-label { font-size: 14px; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-card .stat-value { font-size: 32px; font-weight: bold; color: var(--text); }
    .stat-card .stat-link { font-size: 13px; color: var(--primary); text-decoration: none; }
    .stat-card .stat-link:hover { text-decoration: underline; }
    .stat-card.stat-categories { border-left: 4px solid #2563eb; }
    .stat-card.stat-products { border-left: 4px solid #16a34a; }
    .stat-card.stat-orders { border-left: 4px solid #d97706; }
    .stat-card.stat-available { border-left: 4px solid var(--primary); }

    .loading-spinner { display: flex; justify-content: center; padding: 60px; }
    .spinner {
      width: 32px; height: 32px;
      border: 4px solid var(--border); border-top-color: var(--primary);
      border-radius: 50%; animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header class="admin-header">
    <h1>Food Store Admin</h1>
    <nav>
      <span id="user-info"></span>
      <button id="btn-logout" class="btn-logout" type="button">Cerrar Sesión</button>
    </nav>
  </header>

  <div class="admin-layout">
    <nav class="admin-sidebar">
      <a href="/src/pages/admin/index.html" class="active">Dashboard</a>
      <span>Categorías</span>
      <span>Productos</span>
      <span>Pedidos</span>
      <span>Usuarios</span>
    </nav>

    <main class="admin-content">
      <h2>Dashboard</h2>

      <div id="loading-spinner" class="loading-spinner">
        <div class="spinner"></div>
      </div>

      <div id="stats-grid" class="stats-grid hidden">
        <div class="stat-card stat-categories">
          <span class="stat-label">Categorías</span>
          <span class="stat-value" id="stat-categorias">-</span>
          <a href="/src/pages/admin/categories/" class="stat-link">Gestionar categorías</a>
        </div>
        <div class="stat-card stat-products">
          <span class="stat-label">Productos</span>
          <span class="stat-value" id="stat-productos">-</span>
          <a href="/src/pages/admin/products/" class="stat-link">Gestionar productos</a>
        </div>
        <div class="stat-card stat-orders">
          <span class="stat-label">Pedidos</span>
          <span class="stat-value" id="stat-pedidos">-</span>
          <a href="/src/pages/admin/orders/" class="stat-link">Gestionar pedidos</a>
        </div>
        <div class="stat-card stat-available">
          <span class="stat-label">Total de productos</span>
          <span class="stat-value" id="stat-disponibles">-</span>
          <a href="/src/pages/admin/products/" class="stat-link">Ver total de productos</a>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="/src/main.ts"></script>
  <script type="module" src="./admin.ts"></script>
</body>
</html>
