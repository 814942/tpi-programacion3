name: Build and BootRun

on:
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-bootrun:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: BootRun (smoke test)
        run: |
          timeout 30s ./gradlew bootRun || true
        env:
          SPRING_PROFILES_ACTIVE: test
        # El comando se corta a los 30s para evitar que quede colgado el workflow
        # Si arranca sin errores, se considera exitoso
