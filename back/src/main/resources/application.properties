spring.application.name=foodstore-backend

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/foodstore}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.connection-timeout=5000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET:clave-secreta-para-jwt-debe-tener-al-menos-256-bits-de-longitud-para-hs256}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.jwt.secret.is-base64=false

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html

# Admin seed credentials (override via env var APP_ADMIN_EMAIL o application-local.properties)
app.admin.email=admin@admin.com
app.admin.password=123456

# Server
server.port=${SERVER_PORT:8080}
