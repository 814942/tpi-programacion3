spring.application.name=foodstore-backend
spring.profiles.active=local

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/foodstore}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET:clave-secreta-para-jwt-debe-tener-al-menos-256-bits-de-longitud-para-hs256}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.jwt.secret.is-base64=false

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html

# Server
server.port=${SERVER_PORT:8080}
