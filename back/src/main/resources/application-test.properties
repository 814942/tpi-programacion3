# Test profile - H2 in-memory database
spring.datasource.url=jdbc:h2:mem:foodstore;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

# Disable JWT for integration tests (no auth required)
app.jwt.secret=test-secret-key-that-is-at-least-256-bits-long-for-hs256
app.jwt.expiration=86400000
app.jwt.secret.is-base64=false
